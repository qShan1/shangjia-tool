name: Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.exists.outputs.release_exists == 'false' }}
    env:
      UPDATE_GITHUB_OWNER: ${{ github.repository_owner }}
      UPDATE_GITHUB_REPO: ${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read version
        id: version
        shell: bash
        run: |
          tag="$(tr -d '\r\n' < static/version.txt)"
          if [[ -z "$tag" ]]; then
            echo "static/version.txt is empty" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check release exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate update manifest
        if: steps.exists.outputs.release_exists != 'true'
        shell: bash
        run: |
          python3 generate_update_manifest.py .

      - name: Create tag and release
        if: steps.exists.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            update_files.json \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

  desktop:
    name: Build Windows desktop bundle
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.release_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $tag = (Get-Content -Raw static/version.txt).Trim()
          if (-not $tag) { throw 'static/version.txt is empty' }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check release
        id: release
        shell: pwsh
        run: |
          gh release view "${{ steps.version.outputs.tag }}" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Release was not created' }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pywebview pyinstaller

      - name: Build desktop bundle
        shell: pwsh
        run: .\scripts\build_desktop.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE\release-dist"

      - name: Create desktop archive
        shell: pwsh
        run: Compress-Archive -Path release-dist\ShangjiaTool -DestinationPath "ShangjiaTool-${{ steps.version.outputs.tag }}-windows-x64.zip"

      - name: Upload desktop archive
        shell: pwsh
        run: gh release upload "${{ steps.version.outputs.tag }}" "ShangjiaTool-${{ steps.version.outputs.tag }}-windows-x64.zip#Windows desktop bundle (x64)" --clobber
