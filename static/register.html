<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - SHANGJIA TOOL</title>
  <link rel="icon" type="image/svg+xml" href="/static/shangjia-mark.svg">
  <link rel="stylesheet" href="/static/lib/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/lib/bootstrap-icons/bootstrap-icons.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; }
    .register-card { background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); width: 100%; max-width: 400px; max-height: 95vh; overflow-y: auto; overflow-x: hidden; margin: 16px; }
    .register-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 28px 24px; text-align: center; border-radius: 16px 16px 0 0; }
    .register-header img { width: 56px; height: 56px; margin-bottom: 8px; }
    .register-header h2 { margin: 0; font-size: 1.4rem; font-weight: 700; }
    .register-header p { margin: 6px 0 0; opacity: 0.85; font-size: 0.85rem; }
    .register-body { padding: 28px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: #495057; }
    .input-wrap { position: relative; }
    .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #adb5bd; z-index: 5; }
    .input-wrap input { width: 100%; padding: 11px 14px 11px 42px; border: 2px solid #e9ecef; border-radius: 10px; font-size: 0.95rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .input-wrap input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
    .btn-register { width: 100%; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }
    .btn-register:hover { opacity: 0.92; }
    .btn-register:active { transform: scale(0.98); }
    .btn-register:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert { border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; margin-bottom: 14px; }
    .login-link { text-align: center; margin-top: 16px; font-size: 0.85rem; }
    .login-link a { color: #667eea; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="register-card">
    <div class="register-header">
      <img src="/static/shangjia-mark.svg" alt="Logo">
      <h2>用户注册</h2>
      <p>注册后即可使用上架工具</p>
    </div>
    <div class="register-body">
      <div id="alertContainer"></div>
      <form id="registerForm">
        <div class="form-group">
          <label><i class="bi bi-person"></i> 用户名</label>
          <div class="input-wrap">
            <i class="bi bi-person-fill"></i>
            <input type="text" id="username" placeholder="3-20个字符，字母、数字、下划线" autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label><i class="bi bi-lock"></i> 设置密码</label>
          <div class="input-wrap">
            <i class="bi bi-lock-fill"></i>
            <input type="password" id="password" placeholder="至少6个字符" autocomplete="new-password">
          </div>
        </div>
        <div class="form-group">
          <label><i class="bi bi-lock"></i> 确认密码</label>
          <div class="input-wrap">
            <i class="bi bi-lock-fill"></i>
            <input type="password" id="confirmPassword" placeholder="再次输入密码" autocomplete="new-password">
          </div>
        </div>
        <button type="submit" class="btn-register" id="registerBtn">
          <i class="bi bi-person-plus"></i> 立即注册
        </button>
      </form>
      <div class="login-link">
        <span style="color:#6c757d;">已有账号？</span>
        <a href="/login.html">立即登录</a>
      </div>
    </div>
  </div>

  <script src="/static/lib/bootstrap/bootstrap.bundle.min.js"></script>
  <script>
    function showAlert(msg, type) {
      type = type || 'danger';
      const c = document.getElementById('alertContainer');
      const icon = type === 'success' ? 'check-circle' : 'exclamation-triangle';
      c.innerHTML = '<div class="alert alert-' + type + '"><i class="bi bi-' + icon + '-fill"></i> ' + msg + '</div>';
    }

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (username.length < 3 || username.length > 20) { showAlert('用户名长度必须在3-20个字符之间'); return; }
      if (!/^[a-zA-Z0-9_]+$/.test(username)) { showAlert('用户名只能包含字母、数字和下划线'); return; }
      if (password.length < 6) { showAlert('密码长度至少6个字符'); return; }
      if (password !== confirmPassword) { showAlert('两次输入的密码不一致'); return; }

      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 注册中...';

      try {
        const r = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        });
        const result = await r.json();
        if (result.success) {
          showAlert(result.message, 'success');
          setTimeout(() => window.location.href = '/login.html', 1500);
        } else {
          showAlert(result.message);
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-person-plus"></i> 立即注册';
        }
      } catch(err) {
        showAlert('注册失败，请检查网络连接');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-person-plus"></i> 立即注册';
      }
    });
  </script>
</body>
</html>
