<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - SHANGJIA TOOL</title>
  <link rel="icon" type="image/svg+xml" href="/static/shangjia-mark.svg">
  <link rel="stylesheet" href="/static/lib/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/lib/bootstrap-icons/bootstrap-icons.css">
    <script>
    (function () {
      try {
        var m = localStorage.getItem('darkMode');
        var dark = m === 'dark' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
    <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body {
      background:
        radial-gradient(1200px 620px at 12% -10%, rgba(10, 124, 102, 0.10), transparent 60%),
        radial-gradient(1000px 520px at 112% 8%, rgba(148, 163, 184, 0.14), transparent 55%),
        #e8edf1;
      display: flex; align-items: center; justify-content: center;
    }
    .register-card {
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14), inset 0 1px rgba(255, 255, 255, 0.95);
      -webkit-backdrop-filter: blur(28px) saturate(1.5);
      backdrop-filter: blur(28px) saturate(1.5);
      width: 100%; max-width: 420px; max-height: 95vh;
      overflow-y: auto; overflow-x: hidden; margin: 16px;
    }
    .register-header { padding: 30px 28px 4px; text-align: center; }
    .register-header img { width: 56px; height: 56px; margin-bottom: 10px; }
    .register-header h2 { margin: 0; font-size: 1.35rem; font-weight: 700; color: #1d1d1f; letter-spacing: 0.01em; }
    .register-header p { margin: 6px 0 0; color: #6e6e73; font-size: 0.85rem; }
    .register-body { padding: 20px 28px 28px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 7px; font-weight: 600; font-size: 0.85rem; color: #1d1d1f; }
    .input-wrap { position: relative; }
    .input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #8e8e93; z-index: 5; }
    .input-wrap input {
      width: 100%; padding: 11px 14px 11px 42px;
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 12px;
      color: #1d1d1f;
      font-size: 0.95rem;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04);
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }
    .input-wrap input::placeholder { color: #8e8e93; }
    .input-wrap input:focus { border-color: #0a7c66; background: rgba(255, 255, 255, 0.68); box-shadow: 0 0 0 4px rgba(10, 124, 102, 0.14); }
    .btn-register {
      width: 100%; padding: 12px; border: none; border-radius: 999px;
      background: #0a7c66; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.18), 0 8px 20px rgba(10, 124, 102, 0.24);
      transition: opacity 0.18s ease, transform 0.1s ease, box-shadow 0.18s ease, background 0.18s ease;
    }
    .btn-register:hover { background: #076a58; box-shadow: inset 0 1px rgba(255, 255, 255, 0.2), 0 10px 26px rgba(10, 124, 102, 0.3); }
    .btn-register:active { transform: scale(0.98); }
    .btn-register:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert { border-radius: 12px; padding: 10px 14px; font-size: 0.85rem; margin-bottom: 14px; }
    .login-link { text-align: center; margin-top: 16px; font-size: 0.85rem; color: #6e6e73; }
    .login-link a { color: #0a7c66; text-decoration: none; font-weight: 600; }
    [data-theme="dark"] body {
      background:
        radial-gradient(1200px 620px at 12% -10%, rgba(16, 185, 129, 0.10), transparent 60%),
        radial-gradient(1000px 520px at 112% 8%, rgba(56, 189, 248, 0.07), transparent 55%),
        #1c1c1e;
    }
    [data-theme="dark"] .register-card {
      background: rgba(44, 44, 46, 0.82);
      border-color: rgba(235, 235, 245, 0.16);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3), inset 0 1px rgba(255, 255, 255, 0.08);
    }
    [data-theme="dark"] .register-header img { filter: invert(1); }
    [data-theme="dark"] .register-header h2 { color: #f5f5f7; }
    [data-theme="dark"] .register-header p { color: #a1a1a6; }
    [data-theme="dark"] .form-group label { color: #f5f5f7; }
    [data-theme="dark"] .input-wrap input { background: rgba(58, 58, 60, 0.82); border-color: rgba(235, 235, 245, 0.18); color: #f5f5f7; }
    [data-theme="dark"] .input-wrap input::placeholder { color: #98989f; }
    [data-theme="dark"] .input-wrap input:focus { border-color: #0a7c66; background: rgba(58, 58, 60, 0.96); }
    [data-theme="dark"] .login-link { color: #a1a1a6; }
    [data-theme="dark"] .login-link a { color: #2dd4bf; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>

</head>
<body>
  <div class="register-card">
    <div class="register-header">
      <img src="/static/shangjia-mark.svg" alt="Logo">
      <h2>用户注册</h2>
      <p>注册后即可使用上架工具</p>
    </div>
    <div class="register-body">
      <div id="alertContainer"></div>
      <form id="registerForm">
        <div class="form-group">
          <label><i class="bi bi-person"></i> 用户名</label>
          <div class="input-wrap">
            <i class="bi bi-person-fill"></i>
            <input type="text" id="username" placeholder="3-20个字符，字母、数字、下划线" autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label><i class="bi bi-lock"></i> 设置密码</label>
          <div class="input-wrap">
            <i class="bi bi-lock-fill"></i>
            <input type="password" id="password" placeholder="至少6个字符" autocomplete="new-password">
          </div>
        </div>
        <div class="form-group">
          <label><i class="bi bi-lock"></i> 确认密码</label>
          <div class="input-wrap">
            <i class="bi bi-lock-fill"></i>
            <input type="password" id="confirmPassword" placeholder="再次输入密码" autocomplete="new-password">
          </div>
        </div>
        <button type="submit" class="btn-register" id="registerBtn">
          <i class="bi bi-person-plus"></i> 立即注册
        </button>
      </form>
      <div class="login-link">
        <span style="color:#6c757d;">已有账号？</span>
        <a href="/login.html">立即登录</a>
      </div>
    </div>
  </div>

  <script src="/static/lib/bootstrap/bootstrap.bundle.min.js"></script>
  <script>
    function showAlert(msg, type) {
      type = type || 'danger';
      const c = document.getElementById('alertContainer');
      const icon = type === 'success' ? 'check-circle' : 'exclamation-triangle';
      c.innerHTML = '<div class="alert alert-' + type + '"><i class="bi bi-' + icon + '-fill"></i> ' + msg + '</div>';
    }

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (username.length < 3 || username.length > 20) { showAlert('用户名长度必须在3-20个字符之间'); return; }
      if (!/^[a-zA-Z0-9_]+$/.test(username)) { showAlert('用户名只能包含字母、数字和下划线'); return; }
      if (password.length < 6) { showAlert('密码长度至少6个字符'); return; }
      if (password !== confirmPassword) { showAlert('两次输入的密码不一致'); return; }

      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 注册中...';

      try {
        const r = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        });
        const result = await r.json();
        if (result.success) {
          showAlert(result.message, 'success');
          setTimeout(() => window.location.href = '/login.html', 1500);
        } else {
          showAlert(result.message);
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-person-plus"></i> 立即注册';
        }
      } catch(err) {
        showAlert('注册失败，请检查网络连接');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-person-plus"></i> 立即注册';
      }
    });
  </script>
</body>
</html>
